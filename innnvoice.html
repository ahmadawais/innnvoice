<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>innnvoice</title>
<meta name="description" content="Fill in an invoice and download it as a PDF. Works offline, nothing leaves your browser.">
<style>
	/*
	 * Proportions follow the golden ratio (φ ≈ 1.618):
	 * - layout splits 38.2% form / 61.8% preview
	 * - spacing steps through Fibonacci numbers (5 8 13 21 34 55)
	 * - type scales by √φ ≈ 1.272 from a 14px base (11 · 14 · 17.8 · 22.6)
	 */
	:root {
		--phi: 1.618;
		--s1: 5px;
		--s2: 8px;
		--s3: 13px;
		--s4: 21px;
		--s5: 34px;
		--s6: 55px;
		--t-xs: 11px;
		--t-sm: 12.5px;
		--t-md: 14px;
		--t-lg: 17.8px;
		--t-xl: 22.6px;
		--r-sm: 8px;
		--r-md: 13px;
		--control: 34px;

		--bg: #f5f5f3;
		--canvas: #ebebe8;
		--panel: #ffffff;
		--ink: #18181b;
		--ink-2: #3f3f46;
		--muted: #71717a;
		--faint: #a1a1aa;
		--line: #e7e7e4;
		--line-strong: #d4d4d0;
		--field: #fafaf9;
		--field-hover: #f4f4f2;
		--accent: #5a9f7d;
		--accent-ink: #ffffff;
		--danger: #d35c5c;
		--ring: color-mix(in srgb, var(--accent) 35%, transparent);
		--shadow-paper: 0 1px 2px rgb(0 0 0 / 0.06), 0 8px 21px rgb(0 0 0 / 0.08), 0 34px 55px -21px rgb(0 0 0 / 0.18);
		--shadow-pop: 0 1px 2px rgb(0 0 0 / 0.06), 0 5px 13px rgb(0 0 0 / 0.06);
		color-scheme: light;
	}
	@media (prefers-color-scheme: dark) {
		:root {
			--bg: #0c0c0e;
			--canvas: #08080a;
			--panel: #141417;
			--ink: #f4f4f5;
			--ink-2: #d4d4d8;
			--muted: #a1a1aa;
			--faint: #71717a;
			--line: #232328;
			--line-strong: #2f2f35;
			--field: #0f0f12;
			--field-hover: #18181c;
			--shadow-paper: 0 1px 2px rgb(0 0 0 / 0.4), 0 13px 34px rgb(0 0 0 / 0.45), 0 55px 89px -34px rgb(0 0 0 / 0.6);
			--shadow-pop: 0 1px 2px rgb(0 0 0 / 0.4), 0 5px 13px rgb(0 0 0 / 0.3);
			color-scheme: dark;
		}
	}

	* { box-sizing: border-box; }
	html, body { margin: 0; height: 100%; }
	body {
		background: var(--bg);
		color: var(--ink);
		font: var(--t-md) / var(--phi) -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Inter, Helvetica, Arial, sans-serif;
		-webkit-font-smoothing: antialiased;
		font-feature-settings: 'cv11', 'ss01';
		display: grid;
		grid-template-columns: minmax(380px, 38.2fr) minmax(0, 61.8fr);
		grid-template-rows: auto minmax(0, 1fr);
		grid-template-areas: 'bar bar' 'form preview';
	}
	::selection { background: var(--ring); }

	/* ─── Top bar ─────────────────────────────────────────────────────────── */

	header {
		grid-area: bar;
		display: flex;
		align-items: center;
		gap: var(--s3);
		padding: var(--s3) var(--s4);
		background: color-mix(in srgb, var(--panel) 85%, transparent);
		backdrop-filter: saturate(1.6) blur(13px);
		border-bottom: 1px solid var(--line);
		position: sticky;
		top: 0;
		z-index: 3;
	}
	.brand { display: flex; align-items: center; gap: var(--s2); margin-right: auto; text-decoration: none; color: inherit; }
	.brand-mark {
		width: var(--control);
		height: var(--control);
		border-radius: var(--r-sm);
		background: var(--badge, var(--accent));
		display: grid;
		place-items: center;
		color: #fff;
		box-shadow: inset 0 -2px 0 rgb(0 0 0 / 0.12);
		transition: background 0.3s ease;
	}
	.brand-mark svg { width: 18px; height: 18px; }
	.brand h1 { font-size: var(--t-lg); line-height: 1; margin: 0; letter-spacing: -0.02em; font-weight: 650; }
	.brand p { margin: 3px 0 0; font-size: var(--t-xs); color: var(--muted); line-height: 1; }

	.balance {
		display: flex;
		align-items: baseline;
		gap: var(--s2);
		padding: 0 var(--s3);
		height: var(--control);
		align-items: center;
		border-radius: var(--r-sm);
		background: var(--field);
		border: 1px solid var(--line);
		font-size: var(--t-sm);
		color: var(--muted);
		white-space: nowrap;
		font-variant-numeric: tabular-nums;
	}
	.balance b { color: var(--ink); font-size: var(--t-md); font-weight: 650; letter-spacing: -0.01em; }

	.actions { display: flex; flex-wrap: wrap; gap: var(--s2); }
	button, .button {
		font: inherit;
		font-size: var(--t-sm);
		font-weight: 550;
		height: var(--control);
		display: inline-flex;
		align-items: center;
		gap: 6px;
		border: 1px solid var(--line-strong);
		background: var(--panel);
		color: var(--ink-2);
		padding: 0 var(--s3);
		border-radius: var(--r-sm);
		cursor: pointer;
		white-space: nowrap;
		box-shadow: 0 1px 1px rgb(0 0 0 / 0.04);
		transition: background 0.15s ease, border-color 0.15s ease, transform 0.1s ease, box-shadow 0.15s ease;
	}
	button svg, .button svg { width: 15px; height: 15px; flex: none; }
	button:hover, .button:hover { background: var(--field-hover); border-color: var(--faint); color: var(--ink); }
	button:active, .button:active { transform: translateY(1px); }
	button:focus-visible, .button:focus-within { outline: 3px solid var(--ring); outline-offset: 1px; }
	button.primary {
		background: var(--ink);
		border-color: var(--ink);
		color: var(--bg);
		box-shadow: var(--shadow-pop);
	}
	button.primary:hover { background: var(--ink-2); border-color: var(--ink-2); color: var(--bg); }
	button.ghost { border-color: transparent; background: transparent; box-shadow: none; color: var(--muted); }
	button.ghost:hover { color: var(--danger); background: color-mix(in srgb, var(--danger) 8%, transparent); }

	/* ─── Form ────────────────────────────────────────────────────────────── */

	form {
		grid-area: form;
		overflow-y: auto;
		padding: var(--s4);
		display: flex;
		flex-direction: column;
		gap: var(--s3);
		background: var(--bg);
		scrollbar-width: thin;
	}
	fieldset {
		border: 1px solid var(--line);
		background: var(--panel);
		border-radius: var(--r-md);
		margin: 0;
		padding: var(--s4);
		display: grid;
		gap: var(--s3);
		min-width: 0;
	}
	legend {
		float: left;
		width: 100%;
		padding: 0;
		margin: 0;
		font-size: var(--t-xs);
		font-weight: 650;
		text-transform: uppercase;
		letter-spacing: 0.08em;
		color: var(--faint);
	}
	legend + * { clear: both; }
	.row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--s3); }
	.row.golden { grid-template-columns: minmax(0, 61.8fr) minmax(0, 38.2fr); }
	label { display: grid; gap: var(--s1); font-size: var(--t-xs); font-weight: 550; color: var(--muted); }
	label.check { display: flex; align-items: center; gap: var(--s2); font-size: var(--t-sm); font-weight: 500; color: var(--ink-2); cursor: pointer; }
	input, textarea, select {
		font: inherit;
		font-size: var(--t-md);
		font-weight: 400;
		line-height: 1.45;
		color: var(--ink);
		background: var(--field);
		border: 1px solid var(--line);
		border-radius: var(--r-sm);
		padding: 0 var(--s3);
		height: var(--control);
		width: 100%;
		min-width: 0;
		transition: border-color 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
	}
	textarea { height: auto; padding: 7px var(--s3); resize: vertical; min-height: calc(var(--control) * var(--phi)); }
	input:hover, textarea:hover { border-color: var(--line-strong); }
	input:focus, textarea:focus { outline: none; border-color: var(--accent); background: var(--panel); box-shadow: 0 0 0 3px var(--ring); }
	input[type='number'] { font-variant-numeric: tabular-nums; text-align: right; }
	input[type='checkbox'] { width: 16px; height: 16px; padding: 0; accent-color: var(--accent); }
	input[type='color'] { padding: 3px; cursor: pointer; }
	input::-webkit-calendar-picker-indicator { opacity: 0.5; cursor: pointer; }
	.hint { font-size: var(--t-xs); font-weight: 400; color: var(--faint); margin: 0; }
	code { font: 11px/1 ui-monospace, SFMono-Regular, Menlo, monospace; padding: 2px 4px; border-radius: 4px; background: var(--field-hover); color: var(--ink-2); }

	/* Status: segmented control tinted with the badge color. */
	.status { position: relative; display: grid; grid-template-columns: repeat(4, 1fr); gap: 3px; padding: 3px; border-radius: var(--r-sm); background: var(--field-hover); border: 1px solid var(--line); }
	.status input { position: absolute; inset: 0; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
	.status label {
		display: flex;
		align-items: center;
		justify-content: center;
		gap: 6px;
		height: 28px;
		font-size: var(--t-sm);
		font-weight: 550;
		color: var(--muted);
		border-radius: 6px;
		cursor: pointer;
		transition: background 0.2s ease, color 0.2s ease, box-shadow 0.2s ease;
	}
	.status label::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: 0.5; }
	.status label:hover { color: var(--ink); }
	.status input:checked + label { background: var(--badge, var(--accent)); color: #fff; box-shadow: var(--shadow-pop); }
	.status input:checked + label::before { opacity: 1; background: #fff; }
	.status input:focus-visible + label { outline: 3px solid var(--ring); }

	/* Line items */
	.items { display: grid; gap: var(--s2); counter-reset: item; }
	.item-head, .item { display: grid; grid-template-columns: minmax(0, 1fr) 55px 89px var(--control); gap: var(--s2); }
	.item-head { font-size: var(--t-xs); font-weight: 550; color: var(--muted); }
	.item-head span:nth-child(2), .item-head span:nth-child(3) { text-align: right; padding-right: var(--s3); }
	.item { align-items: start; padding-bottom: var(--s2); border-bottom: 1px dashed var(--line); }
	.item textarea { min-height: var(--control); height: var(--control); padding-top: 6px; }
	.item button[data-remove] { width: var(--control); padding: 0; justify-content: center; font-size: 13px; }
	.item .amount { grid-column: 1 / -1; font-size: var(--t-xs); color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; padding-right: calc(var(--control) + var(--s2)); }
	#add-item { justify-content: center; border-style: dashed; background: transparent; box-shadow: none; color: var(--muted); }
	#add-item:hover { color: var(--accent); border-color: var(--accent); background: color-mix(in srgb, var(--accent) 6%, transparent); }

	.privacy { display: flex; align-items: center; gap: var(--s2); justify-content: center; font-size: var(--t-xs); color: var(--faint); padding: var(--s2) 0 var(--s4); }
	.privacy svg { width: 13px; height: 13px; }

	/* ─── Preview: the PDF as a sheet of A4 paper ─────────────────────────── */

	main {
		grid-area: preview;
		position: relative;
		min-height: 0;
		display: grid;
		place-items: center;
		padding: var(--s5);
		background:
			radial-gradient(circle at 1px 1px, color-mix(in srgb, var(--ink) 9%, transparent) 1px, transparent 0) 0 0 / 21px 21px,
			var(--canvas);
		border-left: 1px solid var(--line);
		overflow: hidden;
	}
	.paper {
		height: 100%;
		max-width: 100%;
		aspect-ratio: 1 / 1.4142;
		border-radius: 3px;
		overflow: hidden;
		background: #fff;
		box-shadow: var(--shadow-paper);
		animation: rise 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
	}
	@supports not (aspect-ratio: 1) { .paper { width: 100%; } }
	.paper svg { display: block; width: 100%; height: 100%; }
	.error {
		position: absolute;
		inset: var(--s4) var(--s4) auto var(--s4);
		background: var(--danger);
		color: #fff;
		padding: var(--s3) var(--s4);
		border-radius: var(--r-sm);
		box-shadow: var(--shadow-pop);
		font-weight: 500;
		display: none;
	}
	.error.show { display: block; animation: rise 0.3s ease; }
	@keyframes rise { from { opacity: 0; transform: translateY(8px); } }
	@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

	/* ─── Small screens: stack, preview last ──────────────────────────────── */

	@media (max-width: 900px) {
		body { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto auto; grid-template-areas: 'bar' 'form' 'preview'; height: auto; }
		header { flex-wrap: wrap; padding: var(--s3) 16px; }
		.brand p { display: none; }
		.balance { order: 3; width: 100%; justify-content: space-between; }
		form { overflow: visible; padding: 16px; }
		fieldset { padding: var(--s3) 16px var(--s4); }
		main { padding: var(--s4) 16px; border-left: 0; border-top: 1px solid var(--line); }
		.paper { height: auto; width: 100%; }
	}
	@media (max-width: 420px) {
		.actions button span, .actions .button span { display: none; }
		.actions .primary span { display: inline; }
	}
</style>
</head>
<body>
<header>
	<div class="brand">
		<div class="brand-mark" aria-hidden="true">
			<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2h9l5 5v13a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z"/><path d="M14 2v6h6"/><path d="M8 13h8M8 17h5"/></svg>
		</div>
		<div>
			<h1>innnvoice</h1>
			<p>PDF invoices, right in your browser</p>
		</div>
	</div>
	<div class="balance" id="balance"></div>
	<div class="actions">
		<label class="button" for="import" title="Load an innnvoice.json template">
			<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M7 8l5-5 5 5"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/></svg><span>Import JSON</span><input type="file" id="import" accept=".json,application/json" hidden></label>
		<button type="button" id="export" title="Save this invoice as innnvoice.json">
			<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/></svg><span>Export JSON</span></button>
		<button type="button" class="ghost" id="reset" title="Start over from the sample invoice">
			<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg><span>Reset</span></button>
		<button type="button" class="primary" id="download">
			<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2h9l5 5v13a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z"/><path d="M12 11v6M9 14l3 3 3-3"/></svg><span>Download PDF</span></button>
	</div>
</header>

<form id="form" autocomplete="off">
	<fieldset>
		<legend>Status</legend>
		<div class="status" id="status">
			<input type="radio" name="status" id="s-paid" value="paid"><label for="s-paid">Paid</label>
			<input type="radio" name="status" id="s-due" value="due"><label for="s-due">Due</label>
			<input type="radio" name="status" id="s-unpaid" value="unpaid"><label for="s-unpaid">Unpaid</label>
			<input type="radio" name="status" id="s-draft" value="draft"><label for="s-draft">Draft</label>
		</div>
	</fieldset>

	<fieldset>
		<legend>Invoice</legend>
		<label>Title <input data-field="title" data-type="text"></label>
		<div class="row golden">
			<label>Invoice No. <input data-field="invoiceNo" data-type="text"></label>
			<label>Currency <input data-field="currency" data-type="text" maxlength="5"></label>
		</div>
		<div class="row">
			<label>Date <input type="date" data-field="date" data-type="date"></label>
			<label>Due <input type="date" data-field="due" data-type="date"></label>
		</div>
		<label>Intro <span class="hint">One line each. <code>Label: value</code> gets a muted label.</span>
			<textarea data-field="intro" data-type="lines" rows="3"></textarea></label>
	</fieldset>

	<fieldset>
		<legend>Parties</legend>
		<div class="row">
			<label>From <textarea data-field="from" data-type="lines" rows="4"></textarea></label>
			<label>To <textarea data-field="to" data-type="lines" rows="4"></textarea></label>
		</div>
	</fieldset>

	<fieldset>
		<legend>Items</legend>
		<div class="item-head"><span>Description</span><span>Qty</span><span>Rate</span><span></span></div>
		<div class="items" id="items"></div>
		<button type="button" id="add-item">+ Add item</button>
		<label>Paid to date <span class="hint">Ignored when the status is Paid (paid in full).</span>
			<input type="number" step="0.01" data-field="paid" data-type="number"></label>
	</fieldset>

	<fieldset>
		<legend>Notes &amp; payment</legend>
		<label class="check"><input type="checkbox" data-field="showNote" data-type="bool"> Show invoice note and footer</label>
		<label>Invoice note <span class="hint">Separate paragraphs with a blank line.</span>
			<textarea data-field="notes" data-type="paras" rows="4"></textarea></label>
		<label>Footer <input data-field="footer" data-type="text"></label>
		<label class="check"><input type="checkbox" data-field="showBank" data-type="bool"> Show bank details</label>
		<label>Bank details <textarea data-field="details" data-type="lines" rows="4"></textarea></label>
	</fieldset>

	<fieldset>
		<legend>Style &amp; file</legend>
		<div class="row golden">
			<label>File name <input data-field="output" data-type="text"></label>
			<label>Badge color <input type="color" id="color"></label>
		</div>
		<p class="hint">Use <code>**bold**</code> anywhere, and placeholders <code>{year}</code> <code>{Month}</code> <code>{mon}</code> <code>{month}</code> <code>{MM}</code> <code>{DD}</code>.</p>
	</fieldset>

	<p class="privacy">
		<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
		Private by design. Nothing leaves this browser.
	</p>
</form>

<main>
	<div class="paper" id="preview" role="img" aria-label="Invoice preview"></div>
	<div class="error" id="error" role="alert"></div>
</main>

<script>
// <core> Generated by scripts/build-html.js from ./innnvoice; edit it there.
function renderInvoice(tpl, opts = {}) {
	const fail = msg => {
		throw new Error(msg);
	};

	// ─── Dates ───────────────────────────────────────────────────────────────────

	const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
	const MONTHS_LONG = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];

	function parseDate(str) {
		const m = /^(\d{4})-(\d{1,2})(?:-(\d{1,2}))?$/.exec(String(str).trim());
		if (!m) fail(`Invalid date "${str}". Use YYYY-MM or YYYY-MM-DD.`);
		const d = { year: +m[1], month: +m[2], day: m[3] ? +m[3] : 1 };
		if (d.month < 1 || d.month > 12 || d.day < 1 || d.day > 31) fail(`Invalid date "${str}".`);
		return d;
	}

	const pad = n => String(n).padStart(2, '0');
	const fmtDate = d => `${pad(d.day)} ${MONTHS[d.month - 1]} ${d.year}`;

	// ─── Template ────────────────────────────────────────────────────────────────

	const now = opts.now ?? new Date();
	const dateArg = opts.date ?? tpl.date;
	const date = dateArg ? parseDate(dateArg) : { year: now.getFullYear(), month: now.getMonth() + 1, day: 1 };
	const dueArg = opts.dueDate ?? tpl.due;
	const due = dueArg ? parseDate(dueArg) : date;

	const vars = {
		year: date.year,
		mon: MONTHS[date.month - 1],
		Month: MONTHS_LONG[date.month - 1],
		month: date.month,
		MM: pad(date.month),
		DD: pad(date.day),
	};
	const fill = str => String(str ?? '').replace(/\{(\w+)\}/g, (all, key) => (key in vars ? vars[key] : all));

	// Status: option > template "status" > paid.
	const STATUSES = {
		paid: { label: 'Paid', color: '#5a9f7d' },
		due: { label: 'Due', color: '#d35c5c' },
		unpaid: { label: 'Unpaid', color: '#d35c5c' },
		draft: { label: 'Draft', color: '#a3a3a3' },
	};
	for (const [key, color] of Object.entries(tpl.statusColors ?? {})) if (STATUSES[key]) STATUSES[key].color = color;
	const status = opts.status ?? tpl.status ?? 'paid';
	if (!STATUSES[status]) fail(`Unknown status "${status}". Use paid, due, unpaid or draft.`);
	const { label: statusLabel, color: statusColor } = STATUSES[status];

	const currency = tpl.currency ?? 'USD';
	const items = (tpl.items ?? []).map(item => ({ ...item, quantity: Number(item.quantity ?? 1), rate: Number(item.rate ?? 0) }));
	if (!items.length) fail('Template has no "items".');
	if (opts.amount !== undefined && opts.amount !== '') items[0].rate = Number(opts.amount);
	for (const item of items) {
		if (!Number.isFinite(item.rate) || !Number.isFinite(item.quantity)) fail('Item quantity/rate must be numbers.');
	}

	const cents = n => Math.round(n * 100) / 100;
	const subTotal = cents(items.reduce((sum, item) => sum + cents(item.quantity * item.rate), 0));
	// A paid invoice is paid in full unless paidAmount says otherwise.
	const paidAmount = cents(Number(opts.paidAmount ?? (status === 'paid' ? subTotal : (tpl.paid ?? 0))));
	if (!Number.isFinite(paidAmount)) fail('Paid amount must be a number.');
	const balance = cents(subTotal - paidAmount);

	const plain = n => n.toFixed(2);
	const money = n => n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
	const invoiceNo = fill(tpl.invoiceNo ?? `${vars.year}-${vars.MM}`);

	// ─── Fonts (Helvetica / Helvetica-Bold AFM widths, chars 32–126) ─────────────

	const WIDTHS = {
		F1: [278,278,355,556,556,889,667,191,333,333,389,584,278,333,278,278,556,556,556,556,556,556,556,556,556,556,278,278,584,584,584,556,1015,667,667,722,722,667,611,778,722,278,500,667,556,833,722,778,667,778,722,667,611,722,667,944,667,667,611,278,278,278,469,556,333,556,556,500,556,556,278,556,556,222,222,500,222,833,556,556,556,556,333,500,278,556,500,722,500,500,500,334,260,334,584],
		F2: [278,333,474,556,556,889,722,238,333,333,389,584,278,333,278,278,556,556,556,556,556,556,556,556,556,556,333,333,584,584,584,611,975,722,722,722,722,667,611,778,722,278,556,722,611,833,722,778,667,778,722,667,611,722,667,944,667,667,611,333,278,333,584,556,333,556,611,556,611,556,333,611,611,278,278,556,278,889,611,611,611,611,389,556,333,611,556,778,556,556,500,389,280,389,584],
	};

	// Map to WinAnsi-safe text; anything else becomes "?".
	const clean = str =>
		String(str)
			.replace(/[‘’]/g, "'")
			.replace(/[“”]/g, '"')
			.replace(/[–—]/g, '-')
			.replace(/…/g, '...')
			.replace(/[^\n\x20-\x7e\xa0-\xff]/g, '?');

	const textWidth = (str, font, size, tracking = 0) =>
		[...str].reduce((w, ch) => w + (WIDTHS[font][ch.charCodeAt(0) - 32] ?? 556), 0) * (size / 1000) +
		tracking * Math.max(str.length - 1, 0);

	// ─── Drawing (top-down layout units, scaled onto A4) ─────────────────────────

	const PAGE_W = 595.28;
	const PAGE_H = 841.89;
	const MARGIN = 36; // points
	const S = (PAGE_W - MARGIN * 2) / 1752; // layout units → points
	const ops = [];
	const warnings = [];
	const num = n => (Math.round(n * 1000) / 1000).toString();

	function rgb(hex) {
		const h = String(hex).replace('#', '');
		const full = h.length === 3 ? [...h].map(c => c + c).join('') : h;
		const v = parseInt(full, 16);
		if (Number.isNaN(v)) return '0 0 0';
		return [(v >> 16) & 255, (v >> 8) & 255, v & 255].map(c => num(c / 255)).join(' ');
	}

	const escape = str => str.replace(/[\\()]/g, m => `\\${m}`);

	function text(x, y, str, { font = 'F1', size = FS, color = INK, align = 'left', tracking = 0 } = {}) {
		str = clean(str);
		const w = textWidth(str, font, size, tracking);
		if (align === 'right') x -= w;
		if (align === 'center') x -= w / 2;
		ops.push(`BT ${rgb(color)} rg /${font} ${num(size)} Tf ${num(tracking)} Tc 1 0 0 -1 ${num(x)} ${num(y)} Tm (${escape(str)}) Tj ET`);
		return w;
	}

	const rect = (x, y, w, h, color) => ops.push(`${rgb(color)} rg ${num(x)} ${num(y)} ${num(w)} ${num(h)} re f`);

	function roundRect(x, y, w, h, r, color) {
		const k = r * 0.5523;
		ops.push(
			`${rgb(color)} rg`,
			`${num(x + r)} ${num(y)} m ${num(x + w - r)} ${num(y)} l`,
			`${num(x + w - r + k)} ${num(y)} ${num(x + w)} ${num(y + r - k)} ${num(x + w)} ${num(y + r)} c`,
			`${num(x + w)} ${num(y + h - r)} l`,
			`${num(x + w)} ${num(y + h - r + k)} ${num(x + w - r + k)} ${num(y + h)} ${num(x + w - r)} ${num(y + h)} c`,
			`${num(x + r)} ${num(y + h)} l`,
			`${num(x + r - k)} ${num(y + h)} ${num(x)} ${num(y + h - r + k)} ${num(x)} ${num(y + h - r)} c`,
			`${num(x)} ${num(y + r)} l`,
			`${num(x)} ${num(y + r - k)} ${num(x + r - k)} ${num(y)} ${num(x + r)} ${num(y)} c h f`,
		);
	}

	// "Plain **bold** plain" → lines of runs, word-wrapped to maxWidth.
	function wrapRich(str, { size = FS, maxWidth = Infinity } = {}) {
		const lines = [];
		for (const para of clean(str).split('\n')) {
			const tokens = [];
			para.split('**').forEach((seg, i) => {
				const f = i % 2 ? 'F2' : 'F1';
				for (const t of seg.split(/(\s+)/)) if (t) tokens.push({ t, f });
			});

			let line = [];
			let w = 0;
			for (const tok of tokens) {
				const space = /^\s+$/.test(tok.t);
				const tw = textWidth(tok.t, tok.f, size);
				if (space && !line.length) continue;
				if (!space && line.length && w + tw > maxWidth) {
					while (line.length && /^\s+$/.test(line.at(-1).t)) line.pop();
					lines.push(line);
					line = [];
					w = 0;
				}
				line.push(tok);
				w += tw;
			}
			lines.push(line);
		}
		return lines;
	}

	// Draws rich text with its first baseline at y; returns the last baseline.
	function rich(x, y, str, { size = FS, maxWidth = CW, lineHeight = LH, color = INK } = {}) {
		const lines = wrapRich(fill(str), { size, maxWidth });
		lines.forEach((line, i) => {
			let cx = x;
			for (const run of line) cx += text(cx, y + i * lineHeight, run.t, { font: run.f, size, color });
		});
		return y + (lines.length - 1) * lineHeight;
	}

	// ─── Layout ──────────────────────────────────────────────────────────────────

	const FS = 28; // body font size
	const LH = 39; // body line height
	const L = 0;
	const R = 1752;
	const CW = R - L;
	const COL2 = CW / 2; // right column of the header block
	const TOT = CW / 4; // totals column
	const INK = '#333333';
	const MUTED = '#8c8c8c';
	const LINE = '#e3e3e3';

	ops.push(`q ${num(S)} 0 0 ${num(-S)} ${num(MARGIN)} ${num(PAGE_H - MARGIN)} cm`);

	// Header: status badge + title
	const badge = { x: L, y: 0, h: 70 };
	const badgeSize = 38;
	badge.w = textWidth(statusLabel, 'F1', badgeSize) + 44;
	roundRect(badge.x, badge.y, badge.w, badge.h, 4, statusColor);
	text(badge.x + badge.w / 2, badge.y + badge.h / 2 + badgeSize * 0.36, statusLabel, { size: badgeSize, color: '#ffffff', align: 'center' });
	text(badge.x + badge.w + 31, badge.y + badge.h / 2 + 42 * 0.36, fill(tpl.title ?? 'Invoice'), { font: 'F2', size: 42 });

	// Intro: "Key: value" labels muted, statement wrapped to the golden 61.8% measure.
	let y = 138 - LH;
	for (const line of tpl.intro ?? []) {
		const m = /^([A-Za-z][A-Za-z .]{0,15}):\s+(.+)$/.exec(fill(line));
		if (m) {
			y += LH;
			const w = text(L, y, `${m[1]}: `, { color: MUTED });
			rich(L + w, y, m[2]);
		} else y = rich(L, y + LH, line, { maxWidth: CW * 0.618 });
	}

	// From / To (left) and invoice meta (right)
	const top = y + 131;
	text(L, top, 'From', { font: 'F2' });
	let ly = top + 59 - LH;
	for (const line of tpl.from ?? []) ly = rich(L, ly + LH, line, { maxWidth: COL2 - 40 });
	ly += 70;
	text(L, ly, 'To', { font: 'F2' });
	ly += 59 - LH;
	for (const line of tpl.to ?? []) ly = rich(L, ly + LH, line, { maxWidth: COL2 - 40 });

	let ry = top - 2;
	for (const [label, value] of [
		['Invoice No.', `# ${invoiceNo}`],
		['Date', fmtDate(date)],
		['Invoice Due', fmtDate(due)],
	]) {
		text(COL2, ry, label, { font: 'F2' });
		text(COL2, ry + 55, value);
		ry += 55 + 84;
	}
	ry -= 84;

	// Line items. Quantity/rate are left blank for a single unit, as in the original.
	const QTY = 1282;
	const RATE = 1471;
	y = Math.max(ly, ry) + 120;
	text(L, y, 'Description', { font: 'F2', color: MUTED });
	text(QTY, y, 'Quantity', { font: 'F2', color: MUTED, align: 'right' });
	text(RATE, y, 'Rate', { font: 'F2', color: MUTED, align: 'right' });
	text(R, y, 'Amount', { font: 'F2', color: MUTED, align: 'right' });
	let lineY = y + 22;
	rect(L, lineY, CW, 4, LINE);
	lineY += 4;

	for (const item of items) {
		const base = lineY + 47;
		const last = rich(L, base, item.description ?? '', { maxWidth: QTY - L - 200 });
		if (item.quantity !== 1) {
			text(QTY, base, String(item.quantity), { align: 'right' });
			text(RATE, base, plain(item.rate), { align: 'right' });
		}
		text(R, base, `${currency} ${plain(cents(item.quantity * item.rate))}`, { align: 'right' });
		lineY = last + 61;
		rect(L, lineY, CW, 2, LINE);
	}

	// Totals
	const totals = [
		['Sub Total', money(subTotal), 'F1'],
		[`Total (${currency})`, money(subTotal), 'F2'],
		[`Paid to Date (${currency})`, money(paidAmount), 'F2'],
	];
	totals.forEach(([label, value, font], i) => {
		const base = lineY + 59;
		text(TOT + 14, base, label, { font });
		text(R - 14, base, value, { font, align: 'right' });
		lineY = base + 41;
		if (i < totals.length - 1) rect(TOT, lineY, R - TOT, 2, LINE);
	});

	// Balance bar: coloured label cell + bordered value cell
	const box = { x: TOT, y: lineY + 2, w: R - TOT, h: 100, cell: 164, border: 4 };
	roundRect(box.x, box.y, box.w, box.h, 5, statusColor);
	rect(box.x + box.cell, box.y + box.border, box.w - box.cell - box.border, box.h - box.border * 2, '#ffffff');
	const boxBase = box.y + box.h / 2 + FS * 0.36;
	text(box.x + box.cell / 2, boxBase, 'Balance', { color: '#ffffff', align: 'center' });
	text(box.x + box.cell + 16, boxBase, currency, { font: 'F2' });
	text(R - 22, boxBase, money(balance), { font: 'F2', align: 'right' });
	y = box.y + box.h;

	// Notes (opt-in: --note or "showNote": true)
	const showNote = opts.note ?? tpl.showNote ?? false;
	if (showNote && tpl.notes?.length) {
		text(L, (y += 90), 'Invoice Note', { font: 'F2' });
		y += 100 - 64;
		for (const para of tpl.notes) y = rich(L, y + 64, para);
	}

	// Payment details (opt-in: --bank or "showBank": true)
	const showBank = opts.bank ?? tpl.showBank ?? false;
	if (showBank && tpl.details?.length) {
		rect(L, (y += 60), CW, 2, LINE);
		y += 82 - 64;
		for (const line of tpl.details) y = rich(L, y + 64, line);
		rect(L, (y += 60), CW, 2, LINE);
		y += 22;
	}

	if (showNote && tpl.footer) y = rich(L, y + 60, tpl.footer);

	ops.push('Q');
	if (y * S > PAGE_H - MARGIN * 2) warnings.push('Content runs past the bottom of the page; shorten the template.');

	// ─── PDF serialization ───────────────────────────────────────────────────────

	const bytes = str => Uint8Array.from(str, ch => ch.charCodeAt(0) & 255);
	const concat = chunks => {
		const out = new Uint8Array(chunks.reduce((n, c) => n + c.length, 0));
		let at = 0;
		for (const c of chunks) {
			out.set(c, at);
			at += c.length;
		}
		return out;
	};

	function buildPdf(content, info) {
		const raw = bytes(content);
		const stream = opts.deflate ? new Uint8Array(opts.deflate(raw)) : raw;
		const filter = opts.deflate ? ' /Filter /FlateDecode' : '';
		const pdfString = s => `(${escape(clean(s))})`;
		const objects = [
			'<< /Type /Catalog /Pages 2 0 R >>',
			'<< /Type /Pages /Kids [3 0 R] /Count 1 >>',
			`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PAGE_W} ${PAGE_H}] /Resources << /Font << /F1 4 0 R /F2 5 0 R >> >> /Contents 6 0 R >>`,
			'<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>',
			'<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>',
			[bytes(`<< /Length ${stream.length}${filter} >>\nstream\n`), stream, bytes('\nendstream')],
			`<< /Title ${pdfString(info.title)} /Author ${pdfString(info.author)} /Producer (innnvoice) /CreationDate (D:${info.created}) >>`,
		];

		const parts = [bytes('%PDF-1.4\n%\xe2\xe3\xcf\xd3\n')];
		let offset = parts[0].length;
		const offsets = [];
		objects.forEach((body, i) => {
			const chunk = concat([bytes(`${i + 1} 0 obj\n`), ...(Array.isArray(body) ? body : [bytes(body)]), bytes('\nendobj\n')]);
			offsets.push(offset);
			parts.push(chunk);
			offset += chunk.length;
		});

		const xref = [
			`xref\n0 ${objects.length + 1}\n0000000000 65535 f \n`,
			...offsets.map(o => `${String(o).padStart(10, '0')} 00000 n \n`),
			`trailer\n<< /Size ${objects.length + 1} /Root 1 0 R /Info 7 0 R >>\nstartxref\n${offset}\n%%EOF\n`,
		].join('');
		parts.push(bytes(xref));
		return concat(parts);
	}

	const pdf = buildPdf(ops.join('\n'), {
		title: invoiceNo || fill(tpl.title),
		author: tpl.from?.[0] ?? '',
		created: now.toISOString().replace(/[-:T]/g, '').slice(0, 14),
	});

	let output = fill(tpl.output ?? 'invoice-{year}-{MM}.pdf');
	if (status === 'draft') output = output.replace(/(\.pdf)?$/i, '-DRAFT.pdf');

	return {
		pdf,
		content: ops.join('\n'),
		page: [PAGE_W, PAGE_H],
		output,
		invoiceNo,
		status,
		currency,
		date: fmtDate(date),
		balance: money(balance),
		warnings,
	};
}
// </core>

const STORE_KEY = 'innnvoice:template';
const COLORS = { paid: '#5a9f7d', due: '#d35c5c', unpaid: '#d35c5c', draft: '#a3a3a3' };
const $ = sel => document.querySelector(sel);
const form = $('#form');
const itemsEl = $('#items');

const pad = n => String(n).padStart(2, '0');
const firstOfMonth = () => {
	const now = new Date();
	return `${now.getFullYear()}-${pad(now.getMonth() + 1)}-01`;
};
const clone = obj => JSON.parse(JSON.stringify(obj));

let tpl = load() ?? clone(SAMPLE);

function load() {
	try {
		const saved = localStorage.getItem(STORE_KEY);
		return saved ? JSON.parse(saved) : null;
	} catch {
		return null;
	}
}

function save() {
	try {
		localStorage.setItem(STORE_KEY, JSON.stringify(tpl));
	} catch {}
}

// ─── Form ↔ template ─────────────────────────────────────────────────────────

const READ = {
	text: el => el.value,
	date: el => el.value || null,
	number: el => (el.value === '' ? 0 : Number(el.value)),
	bool: el => el.checked,
	lines: el => el.value.split('\n').filter(line => line.trim()),
	paras: el =>
		el.value
			.split(/\n\s*\n/)
			.map(p => p.trim())
			.filter(Boolean),
};

const WRITE = {
	text: (el, v) => (el.value = v ?? ''),
	date: (el, v) => (el.value = v ?? ''),
	number: (el, v) => (el.value = v ?? 0),
	bool: (el, v) => (el.checked = !!v),
	lines: (el, v) => (el.value = (v ?? []).join('\n')),
	paras: (el, v) => (el.value = (v ?? []).join('\n\n')),
};

function fillForm() {
	if (!tpl.date) tpl.date = firstOfMonth();
	for (const el of form.querySelectorAll('[data-field]')) WRITE[el.dataset.type](el, tpl[el.dataset.field]);
	const status = tpl.status ?? 'paid';
	$(`#s-${status}`).checked = true;
	renderItems();
}

function renderItems() {
	itemsEl.replaceChildren(
		...tpl.items.map((item, i) => {
			const row = document.createElement('div');
			row.className = 'item';
			row.dataset.index = i;
			row.innerHTML = `
				<textarea rows="1" data-key="description" aria-label="Description"></textarea>
				<input type="number" step="any" data-key="quantity" aria-label="Quantity">
				<input type="number" step="0.01" data-key="rate" aria-label="Rate">
				<button type="button" class="ghost" data-remove aria-label="Remove item">✕</button>
				<div class="amount"></div>`;
			row.querySelector('[data-key="description"]').value = item.description ?? '';
			row.querySelector('[data-key="quantity"]').value = item.quantity ?? 1;
			row.querySelector('[data-key="rate"]').value = item.rate ?? 0;
			return row;
		}),
	);
	updateAmounts();
}

function updateAmounts() {
	const currency = tpl.currency || 'USD';
	for (const row of itemsEl.children) {
		const item = tpl.items[row.dataset.index];
		const amount = Number(item.quantity ?? 1) * Number(item.rate ?? 0);
		row.querySelector('.amount').textContent = Number.isFinite(amount)
			? `${currency} ${amount.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`
			: '';
	}
}

form.addEventListener('input', event => {
	const el = event.target;
	if (el.dataset.field) tpl[el.dataset.field] = READ[el.dataset.type](el);
	else if (el.name === 'status') tpl.status = el.value;
	else if (el.dataset.key) {
		const item = tpl.items[el.closest('.item').dataset.index];
		item[el.dataset.key] = el.dataset.key === 'description' ? el.value : el.value === '' ? 0 : Number(el.value);
		updateAmounts();
	} else if (el.id === 'color') {
		tpl.statusColors = { ...tpl.statusColors, [tpl.status ?? 'paid']: el.value };
	}
	if (el.dataset.field === 'currency') updateAmounts();
	changed();
});

itemsEl.addEventListener('click', event => {
	if (!event.target.closest('[data-remove]')) return;
	if (tpl.items.length === 1) return flash('An invoice needs at least one item.');
	tpl.items.splice(event.target.closest('.item').dataset.index, 1);
	renderItems();
	changed();
});

$('#add-item').addEventListener('click', () => {
	tpl.items.push({ description: '', quantity: 1, rate: 0 });
	renderItems();
	itemsEl.lastElementChild.querySelector('textarea').focus();
	changed();
});

// ─── Preview & download ──────────────────────────────────────────────────────

let result = null;
let timer = null;

function changed() {
	save();
	clearTimeout(timer);
	timer = setTimeout(render, 250);
}

function render() {
	const status = tpl.status ?? 'paid';
	const color = tpl.statusColors?.[status] ?? COLORS[status];
	$('#color').value = color;
	document.documentElement.style.setProperty('--badge', color);

	try {
		result = renderInvoice(tpl, {
			status,
			date: tpl.date || firstOfMonth(),
			dueDate: tpl.due || undefined,
			note: !!tpl.showNote,
			bank: !!tpl.showBank,
		});
	} catch (err) {
		result = null;
		return flash(err.message);
	}

	flash(result.warnings[0] ?? '');
	$('#balance').innerHTML = `Balance <b>${result.currency} ${result.balance}</b>`;

	$('#preview').innerHTML = toSvg(result.content, result.page);
}

// Draws the PDF content stream as SVG: the exact same drawing operators the
// PDF uses, so the preview matches the download in every browser, phones included.
function toSvg(content, [width, height]) {
	const xml = str => String(str).replace(/[&<>]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[ch]);
	const rgb = ([r, g, b]) => `rgb(${r * 255} ${g * 255} ${b * 255})`;
	const tokens = content.match(/\((?:\\.|[^\\)])*\)|\/\w+|[^\s()]+/g) ?? [];
	const groups = [0];
	let args = [];
	let fill = '#000';
	let font = 'F1';
	let size = 12;
	let tracking = 0;
	let matrix = [1, 0, 0, 1, 0, 0];
	let path = '';
	let out = '';

	for (const tok of tokens) {
		if (tok[0] === '(') args.push(tok.slice(1, -1).replace(/\\(.)/g, '$1'));
		else if (tok[0] === '/') args.push(tok.slice(1));
		else if (/^-?[\d.]+$/.test(tok)) args.push(Number(tok));
		else {
			const a = args;
			args = [];
			if (tok === 'q') groups.push(0);
			else if (tok === 'Q') out += '</g>'.repeat(groups.pop());
			else if (tok === 'cm') {
				out += `<g transform="matrix(${a.join(' ')})">`;
				groups[groups.length - 1]++;
			} else if (tok === 'rg') fill = rgb(a);
			else if (tok === 'Tf') [font, size] = a;
			else if (tok === 'Tc') [tracking] = a;
			else if (tok === 'Tm') matrix = a;
			else if (tok === 'Tj') {
				const weight = font === 'F2' ? 700 : 400;
				out += `<text transform="matrix(${matrix.join(' ')}) scale(1 -1)" font-size="${size}" font-weight="${weight}" letter-spacing="${tracking}" fill="${fill}">${xml(a[0])}</text>`;
			} else if (tok === 're') path += `M${a[0]} ${a[1]}h${a[2]}v${a[3]}h${-a[2]}Z`;
			else if (tok === 'm') path += `M${a.join(' ')}`;
			else if (tok === 'l') path += `L${a.join(' ')}`;
			else if (tok === 'c') path += `C${a.join(' ')}`;
			else if (tok === 'h') path += 'Z';
			else if (tok === 'f') {
				out += `<path d="${path}" fill="${fill}"/>`;
				path = '';
			}
		}
	}
	return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${width} ${height}" font-family="Helvetica, Arial, sans-serif" style="white-space: pre" text-rendering="geometricPrecision"><rect width="100%" height="100%" fill="#fff"/><g transform="matrix(1 0 0 -1 0 ${height})">${out}</g></svg>`;
}

function flash(message) {
	const el = $('#error');
	el.textContent = message;
	el.classList.toggle('show', !!message);
}

function download(blob, name) {
	const a = document.createElement('a');
	a.href = URL.createObjectURL(blob);
	a.download = name;
	a.click();
	setTimeout(URL.revokeObjectURL, 1000, a.href);
}

$('#download').addEventListener('click', () => {
	clearTimeout(timer);
	render();
	if (!result) return;
	const name = result.output.split('/').pop() || 'invoice.pdf';
	download(new Blob([result.pdf], { type: 'application/pdf' }), name.endsWith('.pdf') ? name : `${name}.pdf`);
});

$('#export').addEventListener('click', () => {
	download(new Blob([JSON.stringify(tpl, null, 2) + '\n'], { type: 'application/json' }), 'innnvoice.json');
});

$('#import').addEventListener('change', async event => {
	const file = event.target.files[0];
	event.target.value = '';
	if (!file) return;
	try {
		const data = JSON.parse(await file.text());
		if (!Array.isArray(data.items) || !data.items.length) throw new Error('That JSON has no "items".');
		tpl = data;
		fillForm();
		changed();
	} catch (err) {
		flash(`Could not import ${file.name}: ${err.message}`);
	}
});

$('#reset').addEventListener('click', () => {
	if (!confirm('Replace everything with the sample invoice?')) return;
	tpl = clone(SAMPLE);
	fillForm();
	changed();
});

fillForm();
render();
</script>
